<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browser-based game platform starter template">
    <title>Game Platform</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Game Platform</h1>
            <p class="subtitle">Start building your game here!</p>
        </header>

        <main class="game-container">
            <div class="score-panel">
                <div class="score-item">
                    <span class="score-label">Score:</span>
                    <span id="score" class="score-value">0</span>
                </div>
                <div class="score-item">
                    <span class="score-label">High Score:</span>
                    <span id="highScore" class="score-value">0</span>
                </div>
            </div>

            <div class="canvas-wrapper">
                <canvas id="gameCanvas" width="800" height="600"></canvas>
            </div>

            <div class="controls">
                <button id="startBtn" class="btn btn-primary">Start Game</button>
                <button id="pauseBtn" class="btn btn-secondary">Pause</button>
                <button id="resetBtn" class="btn btn-secondary">Reset</button>
            </div>
        </main>

        <footer>
            <p>Use arrow keys or WASD to move | Click on canvas to interact</p>
        </footer>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
