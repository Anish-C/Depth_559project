<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="3D Underwater Map Explorer">
    <title>Depth 559 - 3D Underwater Map</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0ff;
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            z-index: 100;
            text-shadow: 0 0 10px #0ff;
        }
        .depth-counter {
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .controls-info {
            background: rgba(0, 20, 40, 0.7);
            padding: 15px;
            border: 1px solid #0ff;
            border-radius: 5px;
            max-width: 300px;
        }
        .controls-info p {
            margin: 5px 0;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.152.2/build/three.module.js"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <div class="depth-counter">Depth: <span id="depthValue">0</span>m</div>
        <div class="controls-info">
            <p><strong>Controls:</strong></p>
            <p>W/A/S/D - Move (view-relative)</p>
            <p>Shift - Sprint</p>
            <p>Mouse Drag - Look Around</p>
            <p>F - Toggle Flashlight</p>
        </div>
    </div>

    <script type="module" src="js/ocean.js"></script>
</body>
</html>
