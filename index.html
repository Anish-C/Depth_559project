<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Underwater 3D environment with Three.js">
    <title>Underwater Environment</title>
    <link rel="stylesheet" href="css/underwater-style.css">
</head>
<body>
    <div id="info">
        <h1>Underwater Environment</h1>
        <p>Use WASD or Arrow Keys to move | Mouse to look around | Click to enable controls</p>
        <div id="controls-panel">
            <button id="toggleFog" class="control-btn">Toggle Fog</button>
            <button id="toggleLighting" class="control-btn">Toggle Lighting</button>
            <button id="regenerateTerrain" class="control-btn">Regenerate Terrain</button>
        </div>
    </div>
    
    <!-- Three.js from CDN with integrity check -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" 
            integrity="sha384-OLBgp1GsljhM2TJ+sbHjaiH9txEUvgdDTAzHv2P24donTt6/529l+9Ua0vFImLlb" 
            crossorigin="anonymous"></script>
    
    <!-- Custom underwater scene script -->
    <script src="js/underwater.js"></script>
</body>
</html>
